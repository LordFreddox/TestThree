<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mapas</title>
    <script type="module" src="/src/main.ts"></script>
    <link rel="stylesheet" href="CSS/style.css">
  </head>

  <body style="background-color: black;padding: 0;">
    <div id="containerLabels">
      <canvas id="canvas"></canvas>
      <div id="labelsScene" class="unselectable"></div>
    </div>

    <img id="tutorial" style="display: none;position: fixed;z-index: 1;top: 0;left: 0;width: 20vw; margin-left: 40%;
      height: 10vh;margin-top: 75vw;" 
      src="/img/zoomout.webp" 
      autoplay loop muted playsinline style="position: fixed; top: 10px; left: 10px; width: 300px;
      pointer-events: none;"/>

    <script>
      function toggleVisibility(id) {
        var element = document.getElementById(id);
        element.style.display = (element.style.display === 'none' || element.style.display === '') ? 'block' : 'none';
      }

      function logText(text) {
        console.log(text);
      }
    </script>

    <div id="loadingMain" style="position: absolute;
        width: 100vw;
        height: 100vh;
        background-color: black;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;">
        <div class="load-4">
          <div class="ring-1"></div>
        </div>
        <div id="loading-container" style="width: 80%; background-color: #ccc; border-radius: 20%; margin-top: 10vh;">
          <div id="loading-bar" style="width: 0%; height: 20px; background-color: #4caf50; border-radius: 20%;"></div>
        </div>
    </div>

    <!--create dropdown-->
    <select id="floor-selector" class="floor-selector" title="Select Floor">
    </select>

    <footer id="footer" class="footer show" style="display: none;">
      <input id="search-bar" type="text" class="search-bar" placeholder="Buscar..."/>
      <div class="carousel">
        <div class="carousel-container unselectable">
        </div>
      </div>

    </footer>

    <div id="footer-button" class="footer-button" style="display: none;" onclick="showFooter()"></div>
    
    <script>
      const carouselContainer = document.querySelector('.carousel-container');

      function disableSnap() {
        carouselContainer.style.scrollSnapType = 'none';
      }

      function enableSnap() {
        carouselContainer.style.scrollSnapType = 'x mandatory';
      }

      carouselContainer.addEventListener('touchstart', disableSnap);
      carouselContainer.addEventListener('touchend', enableSnap);
      carouselContainer.addEventListener('pointerdown', disableSnap);
      carouselContainer.addEventListener('pointerup', enableSnap);

      function showFooter() {
        const footer = document.querySelector('.footer');
        footer.classList.add('show');
        document.getElementById('footer-button').style.display = 'none';
      }

      function hideFooter() {
        const footer = document.querySelector('.footer');
        footer.classList.remove('show');
        document.getElementById('footer-button').style.display = 'block';
      }

      document.addEventListener('pointerup', (event) => {
        if (!event.target.closest('.footer') && !event.target.closest('.footer-button')) {
          hideFooter();
        }
      });
    </script>
  </body>
</html>
