<body style="background-color: black;padding: 0;" oncontextmenu="return false;">
  <!--Search place-->>

      <span class="description-title"> Selecciona donde estas y tu destino <br> para poder guiarte. </span>

      <select id="placeEnd" name="place2" title="Busca el segundo lugar:">

      </select>

      <div id="description-path">
      </div>

      <div>
        <button id="previewButton" type="button" style="margin-right: 3vw;">Preview</button>
        <button id="fullviewButton" type="button" style="margin-left: 3vw;">Fullview</button>
      </div>
    </div>
  </div>

  <!--3D View-->>
  <div id="div3DView" style="display: none;" class="MainSettings">
    <img id="tutorial" alt="Zoom Out" style="display: none;position: fixed;z-index: 1;top: 0;left: 0;width: 20vw; margin-left: 40%;
    height: 10vh;margin-top: 75vw;" src="/img/zoomout.webp" autoplay loop muted playsinline style="position: fixed; top: 10px; left: 10px; width: 300px;
    pointer-events: none;" />

    <div>
      <button id="back3D" type="button">Regresar</button>
    </div>

      width: 100vw;

      flex-direction: column;

      justify-content: center;">
  <div class="load-4">
    <div class="ring-1"></div>

    <p id="floor-selector-title" style="color:rgb(0, 0, 0);position:absolute;top:5vh;left:5vw;margin:0;display:none;"
      class="unselectable">Filtrar por Pisos</p>
    <select id="floor-selector" class="floor-selector" title="Select Floor">
    </select>

    <div id="category-selector-parent" style="display: block;">
      <p id="category-selector-title"
        style="color:rgb(0, 0, 0);position:absolute;top:10vh;left:5vw;margin:0;display:none;" class="unselectable">
        Filtrar
        por Categoria</p>
      <select id="category-selector" class="category-selector" title="Select Category" style="display:none;">
      </select>
    </div>

    <footer id="footer" class="footer show" style="display: block;">
      <input id="search-bar" type="text" class="search-bar" placeholder="Buscar..." />
      <div class="carousel">
        <div class="carousel-container unselectable">
        </div>
      </div>

    </footer>

    <div id="footer-button" class="footer-button" style="display: none;" onclick="showFooter()"></div>

    <canvas id="canvas"></canvas>
    <div id="labelsScene" class="unselectable"></div>
  </div>

  <script>
    const carouselContainer = document.querySelector('.carousel-container');

    function disableSnap() {
      carouselContainer.style.scrollSnapType = 'none';
    }

    function enableSnap() {
      carouselContainer.style.scrollSnapType = 'x mandatory';
    }

    carouselContainer.addEventListener('touchstart', disableSnap);
    carouselContainer.addEventListener('touchend', enableSnap);
    carouselContainer.addEventListener('pointerdown', disableSnap);
    carouselContainer.addEventListener('pointerup', enableSnap);

    function showFooter() {
      const footer = document.querySelector('.footer');
      footer.classList.add('show');
      document.getElementById('footer-button').style.display = 'none';
    }

    function hideFooter() {
      const footer = document.querySelector('.footer');
      footer.classList.remove('show');
      document.getElementById('footer-button').style.display = 'block';
    }

    document.addEventListener('pointerup', (event) => {
      if (!event.target.closest('.footer') && !event.target.closest('.footer-button')) {
        hideFooter();
      }
    });

    function toggleVisibility(id) {
      var element = document.getElementById(id);
      element.style.display = (element.style.display === 'none' || element.style.display === '') ? 'block' : 'none';
    }

    function logText(text) {
      console.log(text);
    }
  </script>
</body>
